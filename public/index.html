<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>mdtopdf</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@500;700;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet" />
<style>
  :root {
    --background: #0a0a0a;
    --foreground: #f0f0f0;
    --card: #161616;
    --muted: #1a1a1a;
    --muted-foreground: #8a8a8a;
    --primary: #22c55e;
    --primary-foreground: #0a0a0a;
    --destructive: #ef4444;
    --border: #ffffff14;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  html, body { background: var(--background); }

  body {
    color: var(--foreground);
    font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
    max-width: 760px;
    margin: 0 auto;
    padding: 4rem 1.5rem 3rem;
    background-image:
      linear-gradient(to right, #ffffff08 1px, transparent 1px),
      linear-gradient(to bottom, #ffffff08 1px, transparent 1px);
    background-size: 32px 32px;
  }

  ::selection { background: #22c55e33; color: var(--foreground); }

  h1, h2 {
    font-family: "Manrope", ui-sans-serif, system-ui, sans-serif;
    margin: 0;
  }

  .eyebrow {
    font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-size: 0.75rem;
    color: var(--primary);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .eyebrow::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--primary);
  }

  h1 {
    font-size: clamp(2.5rem, 7vw, 3.75rem);
    font-weight: 800;
    line-height: 1;
    margin: 0.75rem 0 0.5rem;
  }
  h1 .dot {
    display: inline-block;
    width: 0.22em;
    height: 0.22em;
    background: var(--primary);
    margin-left: 0.08em;
  }

  .lede {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: clamp(1.5rem, 4vw, 2rem);
    color: var(--foreground);
    margin: 0 0 2.5rem;
  }
  .lede em { color: var(--primary); font-style: italic; }

  p.sub {
    color: var(--muted-foreground);
    font-size: 0.95rem;
    margin: -2rem 0 2.5rem;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
  }

  textarea {
    width: 100%;
    height: 42vh;
    box-sizing: border-box;
    font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
    font-size: 0.9rem;
    line-height: 1.5;
    padding: 0.75rem;
    background: var(--background);
    color: var(--foreground);
    border: 1px solid var(--border);
    border-radius: calc(var(--radius) - 4px);
    resize: vertical;
  }
  textarea:focus { outline: 2px solid var(--primary); outline-offset: 1px; }

  #customCss {
    height: 16vh;
    margin-top: 0.75rem;
    display: none;
  }
  #customCss.visible { display: block; }

  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    align-items: center;
    margin-top: 1rem;
  }

  button, .file-btn {
    font-family: "Inter", sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    padding: 0.6rem 1.4rem;
    border-radius: 999px;
    cursor: pointer;
    border: 1px solid transparent;
  }

  #convert {
    background: var(--primary);
    color: var(--primary-foreground);
    border: none;
  }
  #convert:disabled { opacity: 0.6; cursor: default; }

  .file-btn {
    background: transparent;
    color: var(--foreground);
    border: 1px solid var(--border);
  }
  input[type="file"] { display: none; }

  select#theme {
    font-family: "Inter", sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    padding: 0.6rem 1.4rem;
    border-radius: 999px;
    cursor: pointer;
    background: transparent;
    color: var(--foreground);
    border: 1px solid var(--border);
  }
  select#theme option { background: var(--card); color: var(--foreground); }

  #status {
    font-family: ui-monospace, monospace;
    font-size: 0.85rem;
    color: var(--destructive);
  }

  footer {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    color: var(--muted-foreground);
    font-size: 0.85rem;
    display: flex;
    justify-content: space-between;
  }
  footer a { color: var(--muted-foreground); }
  footer a:hover { color: var(--primary); }
</style>
</head>
<body>
  <span class="eyebrow">Markdown &rarr; PDF, instantly</span>
  <h1>mdtopdf<span class="dot"></span></h1>
  <p class="lede">paste markdown, get a <em>polished PDF.</em></p>
  <p class="sub">No account. Nothing leaves your machine.</p>

  <div class="card">
    <textarea id="markdown" placeholder="# Title&#10;&#10;Write or paste markdown here...">
# Hello, world

This is **markdown**, converted to a *PDF*.
    </textarea>

    <div class="row">
      <label class="file-btn" for="file">Choose File</label>
      <input type="file" id="file" accept=".md,text/markdown" />
      <select id="theme">
        <option value="default">Default</option>
        <option value="minimal">Minimal</option>
        <option value="serif">Serif</option>
        <option value="dark">Dark</option>
        <option value="sitewebk">SiteWebK</option>
        <option value="custom">Custom CSS&hellip;</option>
      </select>
      <button id="convert">Convert to PDF</button>
      <span id="status"></span>
    </div>

    <textarea id="customCss" placeholder="body { font-family: Georgia, serif; }&#10;h1 { color: #ef4444; }"></textarea>
  </div>

  <footer>
    <span>mdtopdf</span>
    <a href="https://github.com/AliTalebmoh/mdtopdf">GitHub</a>
  </footer>

  <script>
    const textarea = document.getElementById("markdown");
    const fileInput = document.getElementById("file");
    const themeSelect = document.getElementById("theme");
    const customCssBox = document.getElementById("customCss");
    const convertBtn = document.getElementById("convert");
    const status = document.getElementById("status");

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];
      if (file) textarea.value = await file.text();
    });

    themeSelect.addEventListener("change", () => {
      customCssBox.classList.toggle("visible", themeSelect.value === "custom");
    });

    convertBtn.addEventListener("click", async () => {
      status.textContent = "";
      const markdown = textarea.value;
      const isCustom = themeSelect.value === "custom";
      if (isCustom && !customCssBox.value.trim()) {
        status.textContent = "custom CSS is empty";
        return;
      }
      convertBtn.disabled = true;
      convertBtn.textContent = "Converting...";
      try {
        const res = await fetch("/convert", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            markdown,
            theme: themeSelect.value,
            ...(isCustom ? { customCss: customCssBox.value } : {}),
          }),
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.error || `Request failed (${res.status})`);
        }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "document.pdf";
        a.click();
        URL.revokeObjectURL(url);
      } catch (err) {
        status.textContent = err.message;
      } finally {
        convertBtn.disabled = false;
        convertBtn.textContent = "Convert to PDF";
      }
    });
  </script>
</body>
</html>
